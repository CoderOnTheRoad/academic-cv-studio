name: Publish CV Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check publication import
        run: |
          node --check app.js
          node --check studio.js
          node --check studio-model.js
          node --check cv-layout.js
          node --check bibtex.js
          node --check scopus.js
          node tests/bibtex.test.cjs
          node tests/scopus.test.cjs
          node tests/studio.test.cjs
          node tests/layout.test.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir _site
          cp index.html styles.css app.js bibtex.js scopus.js studio-model.js studio.js cv-layout.js data.js _site/
          cp -R assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
